# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "6603f967"

[python]
with-pypy = false
with-docs = true
with-sphinx-doctests = true
with-windows = true
with-future-python = true
with-macos = false
with-free-threaded-python = false

[tox]
use-flake8 = true
additional-envlist = [
    "py311-datetime",
    ]
testenv-deps = [
    "datetime: DateTime",
    "-cconstraints.txt",
    "pytest-cov",
    ]
testenv-setenv = [
    "COVERAGE_FILE=.coverage.{envname}",
    ]
testenv-commands = [
    "python -V",
    # A single Python version cannot reach the required coverage, only the
    # combination of all of them can, thus the check is disabled here and
    # done in the `coverage` environment.
    "pytest --cov=src --cov=tests --cov-report= --cov-fail-under=0 tests {posargs}",
    ]
coverage-command = [
    "coverage erase",
    "coverage combine",
    ]
coverage-setenv = [
    "COVERAGE_FILE=.coverage",
    ]
coverage-additional = [
    "depends = py310,py311,py311-datetime,py312,py313,py314,py315",
    ]

[coverage]
fail-under = 100

[coverage-run]
additional-config = [
    "relative_files = true",
    ]

[isort]
additional-sources = "{toxinidir}/tests"

[flake8]
additional-sources = "tests"

[manifest]
additional-rules = [
    "include *.yaml",
    "recursive-include docs *.ast",
    "recursive-include docs *.bat",
    "recursive-include docs *.jpg",
    "recursive-include tests *.py",
    ]

[check-manifest]
additional-ignores = [
    "docs/CHANGES.rst",
    "docs/_build/html/_images/*",
    "docs/_build/html/_sources/contributing/*",
    "docs/_build/html/_sources/install/*",
    "docs/_build/html/_sources/roadmap/*",
    "docs/_build/html/_sources/upgrade_dependencies/*",
    "docs/_build/html/_sources/usage/*",
    "docs/_build/html/_static/scripts/*",
    ]

[github-actions]
additional-config = [
    "- [\"3.11\", \"py311-datetime\"]",
    ]
# The `coverage` environment runs no tests itself, it only combines the
# coverage data written by the `py3*` environments. In CI each of those runs
# on its own machine, so the `coverage` job finds nothing to combine and
# fails. It therefore has to run the whole `envlist` minus the environments
# that contribute no coverage data. Spelling it that way round avoids
# repeating the list of Python versions here: `envlist` and the `depends` of
# the `coverage` environment stay its only source.
test-commands = [
    "uvx --with tox-uv tox ${{ matrix.config[1] == 'coverage' && '--skip-env \"(lint|docs|release-check)\"' || format('-e {0}', matrix.config[1]) }}",
    ]

[pypi]
trusted-publishing = true
